<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ออฟไลน์ • ระบบบริการการแพทย์แผนไทยและการแพทย์ทางเลือก</title>
<meta name="theme-color" content="#3BAF85">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
:root{--theme:#3BAF85;--bg:#F3FBF7;--ink:#24413A;--muted:#5E7A72}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#FFFFFF,var(--bg));color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
main{width:100%;max-width:430px;text-align:center;background:rgba(255,255,255,.9);border-radius:28px;padding:28px 22px;box-shadow:0 18px 50px rgba(36,65,58,.12)}
img{border-radius:24px;box-shadow:0 10px 26px rgba(36,65,58,.16)}
h1{font-size:1.15rem;margin:14px 0 6px}
p{line-height:1.65;color:var(--muted)}
button{border:0;border-radius:14px;padding:12px 18px;min-height:46px;font:inherit;font-weight:600;background:var(--theme);color:#fff;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="" width="88" height="88">
  <h1>📡 ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
  <p>ระบบบริการการแพทย์แผนไทยและการแพทย์ทางเลือก ต้องเชื่อมต่ออินเทอร์เน็ตเพื่อเปิดข้อมูลจาก Google Sheets ของหน่วยบริการ กรุณาตรวจสอบสัญญาณแล้วลองอีกครั้ง</p>
  <button type="button" id="retry">🔄 ลองอีกครั้ง</button>
</main>
<script>
document.getElementById('retry').onclick = function () { location.href = './'; };
window.addEventListener('online', function () { location.href = './'; });
</script>
</body>
</html>
